<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administration</title>
<style>
:root{--acc:#4f46e5;--bd:#e5e5e8;--mut:#7a7a85}
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f7f8;color:#1f1f28}
header{background:#1e1e2e;color:#fff;padding:14px 24px;display:flex;gap:20px;align-items:center}
header a{color:#a5b4fc}header nav{display:flex;gap:6px;flex:1}
nav button{background:none;border:0;color:#d8d8e0;padding:8px 14px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:#6366f140;color:#fff}
main{max-width:1100px;margin:24px auto;padding:0 24px}section{display:none}section.on{display:block}
input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:6px;background:#fff}
button.p{background:var(--acc);color:#fff;border:0;cursor:pointer}button{cursor:pointer}
table{border-collapse:collapse;width:100%;background:#fff;margin:12px 0}th,td{border:1px solid var(--bd);padding:7px 10px;text-align:left;vertical-align:top}
th{background:#f1f1f4}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.sql{font:12px Consolas,monospace;white-space:pre-wrap;max-width:420px}.ko{color:#b00020}.mut{color:var(--mut)}
.perm{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:12px;margin:10px 0}
.perm label{display:block;margin:4px 0}.perm input[type=text]{width:100%;margin-top:3px}
#msg{color:#b00020;min-height:18px}
</style></head><body>
<header><b>Administration</b><nav>
<button data-t="u" class="on">Comptes</button><button data-t="d">Droits par service</button><button data-t="l">Requêtes SQL</button></nav>
<a href="/chat">Voir le chat</a> <a href="#" id="out">Se déconnecter</a></header>
<main><div id="msg"></div>

<section id="u" class="on"><div class="row">
<input id="nu" placeholder="Identifiant"><input id="np" type="password" placeholder="Mot de passe (10 car. min.)">
<select id="nr"><option value="user">Utilisateur</option><option value="admin">Admin</option></select>
<select id="ns"></select><button class="p" id="cu">Créer le compte</button></div>
<table><thead><tr><th>Identifiant</th><th>Rôle</th><th>Service</th><th>Actif</th><th>Créé le</th><th></th></tr></thead><tbody id="ut"></tbody></table></section>

<section id="d"><div class="row"><input id="sn" placeholder="Nouveau service (ex : Comptabilité)"><button class="p" id="cs">Créer le service</button></div>
<div id="sv"></div></section>

<section id="l"><div class="row"><input id="lu" placeholder="Filtrer par utilisateur">
<select id="ls"><option value="">Tous statuts</option><option>ok</option><option>refusé</option><option>erreur</option></select>
<button id="lr">Actualiser</button></div>
<table><thead><tr><th>Date</th><th>Utilisateur</th><th>Question</th><th>SQL</th><th>Statut</th><th>Lignes</th><th>ms</th></tr></thead><tbody id="lt"></tbody></table></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>{const d=document.createElement('div');d.textContent=s??'';return d.innerHTML};
const fmt=t=>new Date(t*1000).toLocaleString('fr-FR');
async function api(p,m='GET',b){
  const r=await fetch(p,{method:m,headers:{'Content-Type':'application/json','X-Requested-With':'fetch'},body:b&&JSON.stringify(b)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401)location.href='/';
  if(!r.ok){$('msg').textContent=typeof d.detail==='string'?d.detail:'Erreur';throw new Error()}
  $('msg').textContent='';return d}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');$(b.dataset.t).classList.add('on')});
let services=[],schema={};
async function load(){
  schema=await api('/api/admin/schema');services=await api('/api/admin/services');
  $('ns').innerHTML='<option value="">Sans service</option>'+services.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');
  await users();perms();logs()}
async function users(){const us=await api('/api/admin/users');
  $('ut').innerHTML=us.map(u=>`<tr data-id="${u.id}"><td>${esc(u.username)}</td>
  <td><select data-f="role"><option value="user"${u.role==='user'?' selected':''}>Utilisateur</option><option value="admin"${u.role==='admin'?' selected':''}>Admin</option></select></td>
  <td><select data-f="service_id"><option value="">Aucun</option>${services.map(s=>`<option value="${s.id}"${s.id===u.service_id?' selected':''}>${esc(s.name)}</option>`).join('')}</select></td>
  <td><input type="checkbox" data-f="active"${u.active?' checked':''}></td><td>${fmt(u.created_at)}</td>
  <td><button data-pw>Réinitialiser le mot de passe</button></td></tr>`).join('');
  $('ut').querySelectorAll('[data-f]').forEach(el=>el.onchange=async()=>{
    const id=el.closest('tr').dataset.id,f=el.dataset.f;
    const v=f==='active'?el.checked:f==='service_id'?(el.value?+el.value:null):el.value;
    try{await api('/api/admin/users/'+id,'PATCH',{[f]:v})}catch{users()}});
  $('ut').querySelectorAll('[data-pw]').forEach(b=>b.onclick=async()=>{
    const p=prompt('Nouveau mot de passe (10 caractères min.) :');if(p){await api('/api/admin/users/'+b.closest('tr').dataset.id,'PATCH',{password:p});alert('Mot de passe réinitialisé')}})}
$('cu').onclick=async()=>{await api('/api/admin/users','POST',{username:$('nu').value,password:$('np').value,role:$('nr').value,service_id:$('ns').value?+$('ns').value:null});
  $('nu').value=$('np').value='';users()};
$('cs').onclick=async()=>{await api('/api/admin/services','POST',{name:$('sn').value});$('sn').value='';load()};
function perms(){$('sv').innerHTML=services.length?'':'<p class="mut">Créez un premier service pour définir ses droits.</p>';
  services.forEach(s=>{const d=document.createElement('div');d.className='perm';
    const map=Object.fromEntries(s.permissions.map(p=>[p.table,p.columns]));
    d.innerHTML=`<b>${esc(s.name)}</b><p class="mut">Cochez les tables accessibles. Laissez les colonnes vides pour tout autoriser, ou listez-les séparées par des virgules.</p>`+
    Object.entries(schema).map(([t,cols])=>`<label><input type="checkbox" data-t="${esc(t)}"${t in map?' checked':''}> ${esc(t)}
    <span class="mut">(${esc(cols.join(', '))})</span><input type="text" data-c="${esc(t)}" placeholder="colonnes autorisées (optionnel)" value="${esc((map[t]||[]).join(', '))}"></label>`).join('')+
    '<button class="p">Enregistrer les droits</button>';
    d.querySelector('button').onclick=async()=>{
      const droits=[...d.querySelectorAll('[data-t]')].filter(c=>c.checked).map(c=>{
        const v=d.querySelector(`[data-c="${c.dataset.t}"]`).value.split(',').map(x=>x.trim()).filter(Boolean);
        return{table:c.dataset.t,columns:v.length?v:null}});
      await api(`/api/admin/services/${s.id}/permissions`,'PUT',droits);$('msg').textContent='';alert('Droits enregistrés')};
    $('sv').appendChild(d)})}
async function logs(){const l=await api(`/api/admin/logs?username=${encodeURIComponent($('lu').value)}&status=${encodeURIComponent($('ls').value)}`);
  $('lt').innerHTML=l.map(r=>`<tr><td>${fmt(r.created_at)}</td><td>${esc(r.username)}</td><td>${esc(r.question)}</td>
  <td class="sql">${esc(r.sql)}</td><td class="${r.status==='ok'?'':'ko'}">${esc(r.status)}</td><td>${r.row_count??''}</td><td>${r.duration_ms??''}</td></tr>`).join('')}
$('lr').onclick=logs;$('out').onclick=async e=>{e.preventDefault();await api('/api/logout','POST');location.href='/'};load();
</script></body></html>
