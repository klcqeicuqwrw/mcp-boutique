<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistance — Toutat'IS</title>
  <link rel="icon" type="image/svg+xml" href="/static/toutatis.svg">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 85% 15%,#ff8fcb40,transparent 50%),#fafafa;font:16px "Segoe UI",sans-serif;color:#1e1214;text-align:center}
    main{width:min(620px,100%);padding:clamp(24px,6vw,56px);border:1px solid #eee;border-radius:24px;background:#fff;box-shadow:0 16px 60px #1e12140a}
    img{width:88px;height:88px}small{display:block;margin-top:20px;color:#8a6f72;text-transform:uppercase;letter-spacing:.12em}
    h1{font-size:clamp(36px,7vw,64px);line-height:1.1;letter-spacing:-.04em;margin:24px 0 32px}
    a{display:inline-block;padding:14px 20px;background:#d92b1f;color:#fff;border-radius:12px;text-decoration:none;font-weight:700}
    a:hover{background:#b92319}a:focus-visible{outline:3px solid #ff8fcb;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img src="/static/toutatis.svg" alt="Toutat'IS">
    <small>Assistance · Démonstration</small>
    <h1>Débrouille toi</h1>
    <a href="/chat">Retour à l’application</a>
  </main>
</body>
</html>
